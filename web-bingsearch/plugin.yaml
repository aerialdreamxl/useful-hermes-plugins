name: web-bing-search
version: 1.3.1
description: "Bing HTML direct-crawl search provider (primp TLS impersonation, multi-variant parser, subprocess isolation). No API key."
author: AerialdreamXL
kind: backend
provides_web_providers:
  - bing-search
# config_schema 驱动 Settings→Plugins 面板（plugins.entries.web-bing-search.settings）。
# 主人 11-09 DIY 规范：逐功能独立开关；行为保持类默认 true（v1.3 行为即默认），
# 新行为/修改类默认 false；缺键由 register 时 seedMissingSettings 逐键补齐（走官方 writer）。
config_schema:
  stealth_headers:
    type: bool
    label: 伪装头
    description: "MUID/随机Accept-Language/Sec-Fetch 全套。实测无质量增益，价值是降封禁/限速概率（防御性）。故意不设 UA/Sec-Ch-Ua 避免与 TLS 指纹矛盾。"
    default: true
  warm_homepage:
    type: bool
    label: 首页预热
    description: "先 GET cn.bing.com 首页收会话 cookie 再搜索。2026-11-12 实测有害：触发富页面变体（体积3-4倍、h2锚点几乎全灭、结果数不增）。默认关，仅硬封禁换画像时手动开。"
    default: false
  subprocess_isolation:
    type: bool
    label: 子进程隔离
    description: "搜索跑一次性子进程+硬墙钟超时 terminate→kill（根治 primp 持 GIL 冻死 Hermes）。关掉=退回进程内直跑，有 GIL 冻结风险，不建议。"
    default: true
  result_cache:
    type: bool
    label: 结果缓存
    description: "同查询短 TTL 缓存，降频率墙压力。新行为默认关；开启后 TTL 内同查询直接回缓存（可能拿到稍旧结果）。"
    default: false
  cache_ttl_secs:
    type: int
    label: 缓存 TTL（秒）
    description: "result_cache 开启时的缓存有效期，默认 300 秒。"
    default: 300
  search_timeout_secs:
    type: int
    label: 搜索硬超时（秒）
    description: "子进程墙钟上限（含退避重试），超时 terminate→kill 并报错。默认 45 秒。"
    default: 45
  honeypot_truncation_fallback:
    type: bool
    label: 蜜罐截词回退
    description: "2026-11-12 三轮实测：HTML 通道蜜罐不止打长查询，3-4 词也返回首词 homepage 垃圾（python.org/抖音/剑桥词典）。开启后判垃圾降档：截3词→最值钱单词→纯中文长句前3字（CJK边界分词+品牌型号合并）。实测相关性 关=12/70 vs 开=53/78，代价仅垃圾查询多几秒延迟。v1.3.1 起默认开；显式关=尊重不截词原则，长查询可能拿泛泛结果。"
    default: true