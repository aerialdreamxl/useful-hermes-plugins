name: gateway-ui
version: 1.0.0
description: "适用于 Hermes Gateway 的 Qt GUI 组件：托盘状态灯 + 事件总线 + petdex 桌宠浮窗（side-env Qt worker，崩溃隔离）。整体重写，前身 gateway-fluent-gui 废弃。"
author: "@AerialdreamXL + AI collaborator"
manifest_version: 1
provides_hooks:
  - pre_gateway_dispatch
  - pre_api_request
  - post_api_request
  - post_llm_call
  - pre_tool_call
  - api_request_error
  - agent_loop_stopped
config_schema:
  tray_enabled:
    type: boolean
    default: true
    description: "托盘图标本体。false=无图标（worker 被停，supervisor 继续等开回），总线照常。"
  bus_enabled:
    type: boolean
    default: true
    description: "state.json/events.jsonl 写入（cache/gateway-ui，姊妹 gateway-dashboard 契约 §5）。关掉=dashboard 断粮。"
  degrade_window_s:
    type: integer
    default: 300
    description: "红灯观察窗秒数：窗内发生过 LLM 降级（base_url 端点判定）或错误连发≥2 → 红灯。"
  verbose_log:
    type: boolean
    default: false
    description: "详细日志：GW/WK/PET 三前缀写 cache/gateway-ui/debug.log（桌宠物理 pet_debug.log），400KB 滚动。false=零写入。"
  subagent_busy:
    type: boolean
    default: false
    description: "子代理忙线：无活跃会话但有 delegate_task 子代理在跑时，托盘灯亮橙、桌宠演工作。只覆盖本进程派发的子代理。"
  package_index_url:
    type: string
    default: "https://pypi.tuna.tsinghua.edu.cn/simple"
    description: "Qt side-env（gateway-ui-qt）首装 pip 源。已装机器不触发安装。"
  pet:
    type: object
    default: {}
    description: "桌宠独立配置块（与 Hermes display.pet 完全隔开）。enable-pet 总开关默认 false 且三态处理（缺键≠false、默认值不回写）；slug 空=第一只已安装 petdex；scale 0.7；roam true；topmost true；follow_window true（站立线段跟随来源窗口运动）；vertical_roam true（主动上下爬+跨线段跳转）。"
    properties:
      follow_window:
        type: boolean
        default: true
        description: "窗口跟随：桌宠知道自己站的线段属于哪个窗口，窗口移动/缩放时贴线跟随；窗口关闭/最小化立即落体。false=旧行为（靠确认计时器兜底落体）。仅游走开启时生效。"
      vertical_roam:
        type: boolean
        default: true
        description: "垂直游走：漫步决策时随机主动上爬/下爬（下爬为平滑动画非坠落），走到线段端点可跳到邻接线段。false=只保留确认计时器被动上爬，无主动垂直动作。仅游走开启时生效。"
  balance:
    type: object
    default: {}
    description: "余额气泡配置块（余额气泡 BalanceBubble，CONTRACT §10）。全部修改类语义：缺键按默认读、绝不自动落盘。enabled 总开关默认 false（显式打开才起宿主 watcher 周期拉余额，额度纪律）；refresh_s 刷新周期秒（默认 300，钳 60-3600，改小=拉得更勤更费额度）；providers_dir 投放目录（空=用 <home>/balance-providers，非空必须绝对路径且不含 ..，改它=换余额源目录）。"
    properties:
      enabled:
        type: boolean
        default: false
        description: "余额气泡总开关。false=宿主 watcher 空转、不拉取不写 balance_view.json、worker 气泡入口禁用；true=周期拉取全部余额源。默认 false，显式打开才花钱。"
      refresh_s:
        type: integer
        default: 300
        description: "余额刷新周期秒数（钳 60-3600）。宿主 watcher 每隔这么久拉一次全部 provider；手动刷新另有 10s 节流。改小=数据更新但更费 API 额度。"
      providers_dir:
        type: string
        default: ""
        description: "余额源投放目录（每个 *.py 一个 binding）。空=用 <home>/balance-providers（出厂三适配器 deploy 时拷入，目录空才拷不覆盖用户文件）；非空必须绝对路径且不含 ..。改它=换自定义余额源目录。"
      token_plan_edition:
        type: string
        default: "individual"
        description: "百炼 Token Plan 查询版本：individual=个人版月额度（默认），team=团队版席位额度。改它=下次刷新按所选版本取数；所选版本无生效订阅时气泡报错不回落另一版。"
  approval:
    type: object
    default: {}
    description: "审批弹窗 ApprovalPopup（PROMPT §12/§13）。popup_enabled 修改类默认 false：须用户先在 config.yaml 写 security.approval.transport: gateway-ui 选中本 transport，再开此开关才弹窗接管审批；只配 security 不开开关=审批 fail-closed 超时拒绝（About 页亮提醒）。popup_sounds 显示类默认 true（缺键自动补齐）。platform_takeover 修改类默认 false：R29 平台分流——消息平台（飞书/QQ 群/微信等）会话的审批交还原生聊天卡（present 立即 no_response，须配 security.approval.transport_fallback: builtin 才顺序回落）；true=全接管，远程审批也弹本机窗（主人不在家时远程审批断头）。"
    properties:
      popup_enabled:
        type: boolean
        default: false
        description: "审批弹窗总开关。true=危险命令/execute_code 审批改道屏幕右侧 UAC 式弹窗（永远放行/会话放行/单次放行/拒绝四按钮）；false=不弹窗，已选中的 transport 审批只能超时 fail-closed。修改类默认 false，显式打开才接管。"
      popup_sounds:
        type: boolean
        default: true
        description: "审批弹窗到达提示音。true=弹窗飞入时播提示音（无音频设备则静音）；false=静音。显示类缺键自动补齐。"
      platform_takeover:
        type: boolean
        default: false
        description: "消息平台会话审批接管开关（R29）。false（默认）=飞书/QQ 群/微信等远程会话的审批交还原生聊天卡，本弹窗只接管本机（Desktop/TUI/CLI）会话；须 config.yaml 配 security.approval.transport_fallback: builtin 远程审批才会顺序回落到聊天卡，不配则远程审批被快速拒绝。true=全接管，远程审批也弹本机窗——仅主人确定自己总在场时开。修改类默认 false。"